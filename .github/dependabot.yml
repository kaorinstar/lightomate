# Dependabot は、このリポジトリが依存するものに新しいバージョンが出たときにプルリクエストを作成します。
#
# 現時点で対象とするのは GitHub Actions のみです。ワークフローが使うアクションはコミット SHA で
# 固定しているため、この設定がなければ古いまま更新されません。
# 開発言語が決まったら、その言語のパッケージ管理（nuget、npm、pip など）をここに追加します。
#
# Dependabot は独自の名前でブランチを作成します（dependabot/...）。これは CLAUDE.md のブランチ名の
# 規約の対象外で、変更できません。
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
