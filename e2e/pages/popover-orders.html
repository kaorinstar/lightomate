<!doctype html>
<html lang="ja">

    <title>注文履歴（小さな枠）</title>

      .popover {
        display: none;
      }
      .popover.open {

    <div id="orders">
      <div class="order">
        <span class="order-date">2026年9月1日</span>

      </div>

      </div>

      </div>
    </div>
    <div class="popover" id="popover-A-001">
      <ul>
        <li><a href="invoice.html?n=A-001">明細書</a></li>

    <div class="popover" id="popover-A-003">
      <ul>
        <li><a href="invoice.html?n=A-003">明細書</a></li>
        <li><a href="receipt.html?n=A-003">注文の詳細</a></li>
