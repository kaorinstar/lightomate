<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Lightomate：サイトの許可</title>
    <script src="../shared/color-scheme.js"></script>
    <link rel="stylesheet" href="../vendor/tabler/tabler.min.css" />
    <link rel="stylesheet" href="../vendor/noto-sans-jp/wght.css" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="sidepanel.css" />
    <script type="module" src="allow-site.js"></script>
  </head>
  <!--
    記録中に許可がないサイトへ移動したときに、記録中のブラウザの窓の上部に開く小さい窓です（#209）。
    許可がないサイトのページの中には、拡張機能は何も表示できないため、別の窓にしています。
    見た目はサイドパネルの「記録中」の区画に合わせます。
  -->
  <body>
    <main class="card">
      <div class="card-body">
        <h1 class="card-title mb-2">記録中：サイトの許可</h1>
        <p id="allow-site-text" class="mb-2"></p>
        <p class="lm-hint mb-2">
          記録しない場合も、後からサイドパネルの［このサイトを許可して記録］で許可できます。
        </p>
        <div class="lm-buttons">
          <button type="button" class="btn btn-primary" id="allow-site">
            このサイトを許可して記録
          </button>
          <button type="button" class="btn" id="allow-site-skip">記録しない</button>
        </div>
        <p id="allow-site-notice" hidden></p>
      </div>
    </main>
  </body>
</html>
