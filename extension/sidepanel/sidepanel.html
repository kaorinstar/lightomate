<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Lightomate</title>
    <link rel="stylesheet" href="../vendor/tabler/tabler.min.css" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="sidepanel.css" />
    <script type="module" src="sidepanel.js"></script>
  </head>
  <!--
    配置は docs/design-guidelines.md の「サイドパネル」に従います。
    上から、見出し、進行中の作業（該当する状態のときだけ）、このサイトのフローの順です。
  -->
  <body>
    <header class="lm-header">
      <div class="lm-header-text">
        <h1 class="lm-title">Lightomate</h1>
        <p class="lm-sub" id="page-origin">確認中です</p>
      </div>
      <a class="btn btn-sm btn-ghost-secondary" href="../options/options.html" target="_blank"
        >フローの管理</a
      >
    </header>

    <main class="lm-stack">
      <section id="run-section" class="lm-stack" aria-labelledby="run-heading" hidden>
        <h2 id="run-heading" class="visually-hidden">実行の状態</h2>
        <div id="runs" class="lm-stack"></div>
      </section>

      <section id="form-section" class="card" aria-labelledby="form-heading" hidden>
        <div class="card-body">
          <h2 id="form-heading" class="card-title">実行する値の入力</h2>
          <p class="lm-sub mb-3" id="form-description"></p>
          <form id="run-form" novalidate>
            <div id="form-fields" class="lm-stack mb-3"></div>
            <div class="lm-buttons">
              <button type="submit" class="btn btn-primary" id="form-submit">この値で実行</button>
              <button type="button" class="btn" id="form-cancel">キャンセル</button>
            </div>
            <p id="form-notice" hidden></p>
          </form>
        </div>
      </section>

      <section
        id="recording-section"
        class="card lm-card-recording"
        aria-labelledby="recording-heading"
        hidden
      >
        <div class="card-body">
          <div class="lm-row mb-2">
            <span class="lm-rec-dot" aria-hidden="true"></span>
            <h2 id="recording-heading" class="card-title m-0">記録中</h2>
            <span class="lm-sub">手順 <span id="step-count">0</span> 件</span>
            <button type="button" id="stop" class="btn btn-sm btn-danger ms-auto">記録停止</button>
          </div>
          <p id="recording-notice" hidden></p>
          <p class="lm-sub mb-2" id="recording-origin"></p>
          <div id="recording-site" class="mb-2" hidden>
            <p id="recording-site-text" class="mb-2"></p>
            <button type="button" class="btn btn-sm btn-primary" id="recording-allow" hidden>
              このサイトを許可して記録
            </button>
            <p id="recording-allow-notice" hidden></p>
          </div>
          <ol id="steps" class="lm-steps"></ol>
          <div class="lm-buttons mt-2">
            <button type="button" class="btn btn-sm btn-ghost-danger" id="recording-discard">
              破棄
            </button>
          </div>
          <div id="recording-confirm" hidden></div>
          <p id="recording-discard-notice" hidden></p>
        </div>
      </section>

      <section id="result-section" class="card" aria-labelledby="result-heading" hidden>
        <div class="card-body">
          <h2 id="result-heading" class="card-title">記録したフローの保存</h2>
          <p id="result-notice" hidden></p>
          <div class="mb-3">
            <label class="form-label" for="flow-name">フロー名</label>
            <input type="text" class="form-control" id="flow-name" maxlength="200" />
            <div class="invalid-feedback" id="flow-name-feedback"></div>
          </div>
          <div class="lm-buttons">
            <button type="button" class="btn btn-primary" id="save-flow">フローとして保存</button>
            <button type="button" class="btn" id="discard">破棄</button>
          </div>
          <div id="result-confirm" hidden></div>
          <p id="save-notice" hidden></p>
          <details class="mt-3">
            <summary class="lm-sub">
              記録した手順（<span id="result-step-count">0</span> 件）
            </summary>
            <ol id="result-steps" class="lm-steps mt-2"></ol>
          </details>
          <details class="mt-2">
            <summary class="lm-sub">記録した内容（JSON）</summary>
            <textarea
              id="result"
              class="form-control lm-code mt-2"
              readonly
              rows="12"
              spellcheck="false"
            ></textarea>
            <div class="lm-buttons mt-2">
              <button type="button" class="btn btn-sm" id="copy">コピー</button>
              <button type="button" class="btn btn-sm" id="save">ファイルに保存</button>
            </div>
            <p id="json-notice" hidden></p>
          </details>
        </div>
      </section>

      <section class="card" aria-labelledby="flows-heading">
        <div class="card-header lm-card-header">
          <h2 id="flows-heading" class="card-title">このサイトのフロー</h2>
          <button type="button" class="btn btn-sm" id="start" disabled>
            <span class="lm-rec-dot" aria-hidden="true"></span>記録開始
          </button>
        </div>
        <p id="flows-notice" hidden></p>
        <!-- Web ページ以外を表示しているときだけ、すべてのフローを検索できるようにします（#44）。 -->
        <div class="lm-search" id="search-area" hidden>
          <div class="lm-combobox">
            <label class="visually-hidden" for="search">フロー名かサイトで検索</label>
            <input
              type="search"
              class="form-control form-control-sm"
              id="search"
              placeholder="フロー名かサイトで検索"
            />
            <ul id="search-suggestions" class="lm-suggestions" aria-label="検索の候補"></ul>
          </div>
          <select
            class="form-select form-select-sm lm-search-mode"
            id="search-mode"
            aria-label="一致方法"
          ></select>
        </div>
        <p id="flows-empty" class="lm-sub m-3"></p>
        <div id="flows" class="list-group list-group-flush lm-flows"></div>
        <div class="card-footer lm-sub">
          ほかのサイトのフローの確認、JSON の編集と読み込みは「フローの管理」で行います。
        </div>
      </section>
    </main>

    <div id="toast" class="lm-toast-region" role="status" aria-live="polite"></div>
  </body>
</html>
